name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHPUnit (PHP ${{ matrix.php }}${{ matrix.prefer-lowest && ', prefer-lowest' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            prefer-lowest: true
          - php: '8.2'
            prefer-lowest: false
          - php: '8.3'
            prefer-lowest: false
          - php: '8.4'
            prefer-lowest: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.prefer-lowest && 'lowest' || 'stable' }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: |
          if [ "${{ matrix.prefer-lowest }}" = "true" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist --no-progress
          else
            composer install --no-interaction --prefer-dist --no-progress
          fi

      - name: Run PHPUnit
        run: vendor/bin/phpunit tests/
